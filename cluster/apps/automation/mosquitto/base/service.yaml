apiVersion: v1
kind: Service
metadata:
  name: &app mosquitto
spec:
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
    - name: wss
      port: 9001
      targetPort: 9001
  selector:
    app.kubernetes.io/name: *app
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerIP: ${CONFIG_MOSQUITTO_LB_ADDRESS}
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-p
spec:
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
  selector:
    app.kubernetes.io/name: mosquitto
    type: primary