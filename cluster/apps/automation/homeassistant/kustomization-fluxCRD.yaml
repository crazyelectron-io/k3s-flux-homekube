---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: automation-homeassistant-cnpg
  namespace: flux-system
spec:
  path: ./cluster/apps/automation/homeassistant/cnpg
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  timeout: 2m
  retryInterval: 5m
  prune: true
  wait: true
  dependsOn:
    - name: cnpg-system-cnpg