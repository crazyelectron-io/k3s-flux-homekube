---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: &app whisper
  labels:
    app: *app
spec:
  progressDeadlineSeconds: 300
  replicas: 1
  serviceName: *app
  revisionHistoryLimit: 0
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: *app
  template:
    metadata:
      labels:
        app: *app
    spec:
      containers:
        - name: *app
          image: onerahmet/openai-whisper-asr-webservice:latest
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: "8192Mi"
              cpu: 2000m
            requests:
              memory: "4096Mi"
              cpu: 500m
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: 8080
          #   initialDelaySeconds: 60
          #   periodSeconds: 30
          ports:
            - name: http
              containerPort: 9000
          volumeMounts:
          env:
            - name: ASR_MODEL
              value: medium
            - name: ASR_ENGIONE
              value: fast_whisper
            - name: TZ
              value: Europe/Amsterdam