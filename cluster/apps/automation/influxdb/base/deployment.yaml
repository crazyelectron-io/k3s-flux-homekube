---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: &app influxdb-automation
  labels:
    app.kubernetes.io/name: *app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  serviceName: *app
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *app
    spec:
      containers:
        - name: *app
          image: influxdb:2.7.11
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
              name: influxdb-port
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/influxdb2
              name: influxdb-data
            - mountPath: /etc/influxdb2
              name: influxdb-config
          envFrom:
            - secretRef:
                name: influxdb-secrets
            - configMapRef:
                name: influxdb-config
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: influxdb-port
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: influxdb-port
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
      volumes:
        - name: influxdb-data
          persistentVolumeClaim:
            claimName: influxdb-automation-data
        - name: influxdb-config
          persistentVolumeClaim:
            claimName: influxdb-automation-config
