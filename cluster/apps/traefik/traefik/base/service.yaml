apiVersion: v1
kind: Service
metadata:
  name: traefik-metrics
  labels:
    app.kubernetes.io/instance: traefik
    app.kubernetes.io/name: traefik-metrics
    release: prometheus
spec:
  type: ClusterIP
  ports:
    - name: traefik-metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/instance: traefik-traefik
    app.kubernetes.io/name: traefik