apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`traefik.${SECRET_DOMAIN_0}`)"
      kind: Rule
      priority: 10
      services:
        - name: api@internal
          kind: TraefikService
  tls: {}