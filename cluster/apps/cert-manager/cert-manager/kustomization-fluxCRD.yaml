---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-cert-manager
  namespace: flux-system
spec:
  path: ./cluster/apps/cert-manager/cert-manager/base
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  timeout: 2m
  retryInterval: 2m30s
  prune: true
  wait: true
  dependsOn:
    - name: monitoring-system-prometheus-stack
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-cert-manager-issuers
  namespace: flux-system
spec:
  path: ./cluster/apps/cert-manager/cert-manager/issuers
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  timeout: 2m
  retryInterval: 2m30s
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager-cert-manager
    - name: traefik-crds