---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-system-post-deploy-job
  namespace: flux-system
spec:
  path: ./cluster/apps/harbor-system/post-deploy-job/jobs
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  prune: true
  wait: true
  dependsOn:
    - name: harbor-system-harbor
