    PASSWORD="${SECRET_HARBOR_ADMIN_PASSWORD}"
    ROBOT_NAME="automation"
    ROBOT_DESCRIPTION="Robot account for Automation"

    echo ".......... Installing Required Packages ............"
    apt-get update
    apt-get install --no-install-recommends --no-install-suggests curl jq -y

    echo ".......... Creating Harbor Robot Account ............"

    # Get Harbor API token
    TOKEN=$(curl -s -u "$USERNAME:$PASSWORD" "$HARBOR_URL/api/v2.0/users/current" | jq -r '.token')

    # Check if robot account already exists
    #EXISTING_ROBOT=$(curl -s -H "Authorization: Bearer $TOKEN" "$HARBOR_URL/api/v2.0/robots" | grep -oP '(?<="name":")'$ROassistant'(?=")')
