        -H "Authorization: Bearer $TOKEN" \
        -H "Content-Type: application/json" \
        -d '{
          "name": "'$ROBOT_NAME'",
          "description": "'$ROBOT_DESCRIPTION'",
          "duration": 300,
          "level": "project",
          "permissions": [
            {
              "kind": "project",
              "namespace": "'$PROJECT_NAME'",
              "access": [
                {
                  "action": "pull",
                  "resource": "repository"
                },
                {
                  "action": "push",
                  "resource": "repository"
                },
                {
                  "action": "create",
                  "resource": "tag"
                },
                {
                  "action": "delete",
                  "resource": "tag"
                },
                {
                  "action": "create",
                  "resource": "artifact-label"
                },
                {
                  "action": "list",
                  "resource": "artifact"
                },
                {
                  "action": "list",
                  "resource": "repository"
                }
              ]
            }
          ]
        }')

      # Extract robot account name and secret
      ROBOT_ACCOUNT=$(echo $ROBOT_RESPONSE | grep -oP '(?<="name":")[^"]*')
      ROBOT_SECRET=$(echo $ROBOT_RESPONSE | grep -oP '(?<="secret":")[^"]*')

      echo ".......... Harbor Robot Account Created ............"
      # Output robot account details
      echo "Robot Account: $ROBOT_ACCOUNT"
      echo "Robot Secret: $ROBOT_SECRET"
