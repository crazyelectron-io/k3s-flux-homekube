---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - database/kustomization-fluxCRD.yaml
  - harbor/kustomization-fluxCRD.yaml
  # - ./post-deploy-job/kustomization-fluxCRD.yaml
secretGenerator:
  - name: harbor-admin
    namespace: harbor-system
    literals:
      - HARBOR_ADMIN_USER=${SECRET_HARBOR_ADMIN_USER}
      - HARBOR_ADMIN_PASSWORD=${SECRET_HARBOR_ADMIN_PASSWORD}
    options:
      disableNameSuffixHash: true
