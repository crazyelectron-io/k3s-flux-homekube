---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rancher
spec:
  interval: 15m
  chart:
    spec:
      chart: *app
      version: 2.10.1
      sourceRef:
        kind: HelmRepository
        name: rancher-charts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    debug: false
    hostname: "rancher.${SECRET_DOMAIN_0}"
    replicas: 3
    tls: external
    bootstrapPassword: "${SECRET_RANCHER_ADMIN_PASSWORD}"