apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rancher-external
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`rancher.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: rancher
          port: 80
  tls: {}
