apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alloy-external
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`alloy.${SECRET_DOMAIN_0}`)"
      kind: Rule
      services:
        - name: grafana-alloy
          port: 12345
  tls: {}