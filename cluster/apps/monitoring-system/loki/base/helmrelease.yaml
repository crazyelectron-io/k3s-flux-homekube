---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app loki
spec:
  interval: 15m
  chart:
    spec:
      chart: *app
      version: 6.25.0
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
      interval: 10m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
    read:
      replicas: 0
    backend:
      replicas: 0
    write:
      replicas: 0
    enterprise:
      enabled: false
    loki:
      enabled: true
      isDefault: true
      commonConfig:
        replication_factor: 1
      storage:
        type: 'filesystem'
      schemaConfig:
        configs:
        - from: "2024-12-01"
          store: tsdb
          index:
            prefix: loki_index_
            period: 24h
          object_store: filesystem
          schema: v13
      readinessProbe:
        httpGet:
          path: /ready
          port: http-metrics
        initialDelaySeconds: 45
        timeoutSeconds: 1
      livenessProbe:
        httpGet:
          path: /ready
          port: http-metrics
        initialDelaySeconds: 45
      # image:
      #   registry: "{{harbor_registry}}"
      #   repository: loki
      #   tag: "{{loki_image_tag}}"
      configStorageType: ConfigMap
      # configObjectName: 'loki-config'
      # generatedConfigObjectName: ""
      config: |
        auth_enabled: false
        server:
          http_listen_port: 3100
          grpc_listen_port: 9096
          http_server_read_timeout: 600s
          http_server_write_timeout: 600s
        common:
          path_prefix: /tmp/loki
          storage:
            filesystem:
              chunks_directory: /tmp/loki/chunks
              rules_directory: /tmp/loki/rules
          replication_factor: 1
          ring:
            instance_addr: 127.0.0.1
            kvstore:
              store: inmemory
        limits_config:
          retention_period: 72h
          reject_old_samples: true
          reject_old_samples_max_age: 168h
          max_cache_freshness_per_query: 10m
          split_queries_by_interval: 15m
          query_timeout: 300s
          volume_enabled: true
          # for big logs tune
          per_stream_rate_limit: 512M
          per_stream_rate_limit_burst: 1024M
          cardinality_limit: 200000
          ingestion_burst_size_mb: 1000
          ingestion_rate_mb: 10000
          max_entries_limit_per_query: 1000000
          max_label_value_length: 20480
          max_label_name_length: 10240
          max_label_names_per_series: 300
        schema_config:
          configs:
            - from: 2024-09-01
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: loki_index_
                period: 24h
        ruler:
          alertmanager_url: 'http://localhost:9093'
      datasource:
        jsonData: "{}"
        uid: ""
    # The Loki canary pushes logs to and queries from this loki installation to test it's working correctly
    lokiCanary:
      enabled: true
      # -- If true, the canary will send directly to Loki via the address configured for verification
      push: true
      # -- The name of the label to look for at loki when doing the checks.
      labelname: pod
      # -- Image to use for loki canary
      # image:
      #   registry: "{{harbor_registry}}"
      #   repository: loki-canary
      #   tag: 3.1.1
      #   pullPolicy: IfNotPresent
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
    gateway:
      enabled: false
    chunksCache:
      enabled: true
      batchSize: 4
      parallelism: 5
      timeout: 2000ms
      defaultValidity: 0s
      replicas: 1
      port: 11211
      podDisruptionBudget:
        maxUnavailable: 1
      statefulStrategy:
        type: RollingUpdate
    # memcached:
    #   image:
    #     repository: "{{harbor_registry}}/memcached"
    #     tag: 1.6.23-alpine
