---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app loki
spec:
  interval: 15m
  chart:
    spec:
      chart: *app
      version: 6.24.0
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
      interval: 10m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
    read:
      replicas: 0
    backend:
      replicas: 0
    write:
      replicas: 0
    enterprise:
      enabled: false
    loki:
      enabled: true
      isDefault: true
      commonConfig:
        replication_factor: 1
      storage:
        type: 'filesystem'
      schemaConfig:
        configs:
        - from: "2024-12-01"
          store: tsdb
          index:
            prefix: loki_index_
            period: 24h
          object_store: filesystem
          schema: v13
      readinessProbe:
        httpGet:
          path: /ready
          port: http-metrics
        initialDelaySeconds: 45
        timeoutSeconds: 1
      livenessProbe:
        httpGet:
          path: /ready
          port: http-metrics
        initialDelaySeconds: 45
      # image:
      #   registry: "{{harbor_registry}}"
      #   repository: loki
      #   tag: "{{loki_image_tag}}"
      configStorageType: ConfigMap
      configObjectName: loki-config
      datasource:
        jsonData: "{}"
        uid: ""
    # The Loki canary pushes logs to and queries from this loki installation to test it's working correctly
    lokiCanary:
      enabled: true
      # -- If true, the canary will send directly to Loki via the address configured for verification
      push: true
      # -- The name of the label to look for at loki when doing the checks.
      labelname: pod
      # -- Image to use for loki canary
      # image:
      #   registry: "{{harbor_registry}}"
      #   repository: loki-canary
      #   tag: 3.1.1
      #   pullPolicy: IfNotPresent
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
    gateway:
      enabled: false
    chunksCache:
      enabled: true
      batchSize: 4
      parallelism: 5
      timeout: 2000ms
      defaultValidity: 0s
      replicas: 1
      port: 11211
      podDisruptionBudget:
        maxUnavailable: 1
      statefulStrategy:
        type: RollingUpdate
    # memcached:
    #   image:
    #     repository: "{{harbor_registry}}/memcached"
    #     tag: 1.6.23-alpine
