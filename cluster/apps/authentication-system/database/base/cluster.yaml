---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authelia-cluster
spec:
  description: "PostgreSQL Authelia DB"
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  instances: 2
  bootstrap:
    initdb:
      database: authelia_db
      owner: ${SECRET_AUTHELIA_PG_USER}
      secret:
        name: authelia-cnpg-user-secret
  storage:
    storageClass: longhorn
    size: 1Gi
  resources:
    requests:
      memory: 200Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 1
  monitoring:
    enablePodMonitor: true
